<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Rebuild</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="boot" class="boot">Loading the log…</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <h1 class="brand">The Rebuild</h1>
      <div class="eyebrow" id="eyebrow"></div>
    </div>
    <button class="iconbtn" id="open-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <!-- ==================== TODAY ==================== -->
  <section class="pane on" id="pane-today">
    <div class="stepper" data-stepper></div>
    <div id="banners"></div>

    <div class="bezel"><div class="card" id="hero"></div></div>

    <div class="card">
      <h2>Morning check <span class="aside" id="trend-aside"></span></h2>
      <div class="grid2" id="body-inputs"></div>
      <div class="tiny" style="margin-top:8px" id="weigh-hint"></div>
    </div>

    <div class="card">
      <h2>Steps <span class="aside" id="steps-aside"></span></h2>
      <div class="searchrow">
        <input class="num" type="number" inputmode="numeric" id="i-steps" placeholder="steps today" aria-label="Steps today">
      </div>
      <div class="daybar"><div class="track"><span id="stepbar" style="width:0"></span></div><span class="num" id="stepcount"></span></div>
    </div>

    <div class="card" id="floor-card" hidden></div>

    <div class="card">
      <h2>Notes</h2>
      <textarea id="notes" placeholder="How did today go? Anything to remember at the Sunday check-in."></textarea>
    </div>
  </section>

  <!-- ==================== FOOD ==================== -->
  <section class="pane" id="pane-food">
    <div class="stepper" data-stepper></div>
    <div class="card">
      <div class="meter" style="margin-top:0">
        <div class="row"><span>Calories</span><span><span class="num" id="f-kcal"></span></span></div>
        <div class="track kcal" id="f-kcalbar"><span style="width:0"></span></div>
      </div>
      <div class="meter">
        <div class="row"><span>Protein</span><span><span class="num" id="f-prot"></span></span></div>
        <div class="track prot" id="f-protbar"><span style="width:0"></span></div>
      </div>
    </div>

    <div class="card">
      <h2>Add food <button class="link" id="open-library">My foods</button></h2>
      <div class="searchrow">
        <input id="foodsearch" placeholder="Chicken, puttu, whey…" autocomplete="off" enterkeyhint="search">
        <button class="scanbtn" id="scan-inline" aria-label="Scan a packet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M8 9v6M11 9v6M14 9v6M17 9v6"/></svg>Scan
        </button>
      </div>
      <div id="foodresults"></div>
      <div class="grp" style="margin-top:14px">Your usual</div>
      <div class="chips scroll" id="foodfreq"></div>
    </div>

    <div class="card">
      <h2>Eaten <span class="aside" id="eaten-aside"></span></h2>
      <div id="meals"></div>
    </div>
  </section>

  <!-- ==================== PROGRESS ==================== -->
  <section class="pane" id="pane-prog">
    <div class="card">
      <div class="stats" id="stats"></div>
    </div>
    <div class="card">
      <h2>Weight <span class="aside">1 SEP → 30 APR</span></h2>
      <div id="chart"></div>
      <div class="legend">
        <span><i style="border-color:var(--accent)"></i>Trend</span>
        <span><i style="border-color:var(--ink-3);border-top-style:dashed"></i>Plan line</span>
        <span><i style="border-color:var(--ink-3);border-top-width:5px;width:5px;border-radius:50%"></i>Daily weigh-in</span>
      </div>
    </div>
    <div class="card verdict" id="checkin"></div>
    <div class="card">
      <h2>Weeks</h2>
      <div id="weeks"></div>
    </div>
    <div class="card">
      <h2>Weigh-ins</h2>
      <div id="weighins"></div>
    </div>
  </section>

  <!-- ==================== PLAN ==================== -->
  <section class="pane plan" id="pane-plan"></section>

  <div class="foot">Not medical advice. Food values are estimates — edit any of them under My foods.</div>
</div>

<nav class="tabs" id="tabs" hidden>
  <button class="on" data-t="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M8.5 13l2.5 2.5 4.5-5"/></svg>Today</button>
  <button data-t="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 12h16a8 8 0 0 1-16 0ZM8 8c0-1.5 1-1.5 1-3M12 8c0-1.5 1-1.5 1-3M16 8c0-1.5 1-1.5 1-3"/></svg>Food</button>
  <button class="scan" id="scan-nav" aria-label="Scan a packet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M8 9v6M11 9v6M14 9v6M17 9v6"/></svg></button>
  <button data-t="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 19h16M5 15l4-4 3 2.5L19 6"/><path d="M15 6h4v4"/></svg>Progress</button>
  <button data-t="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 4h9l3 3v13H6z"/><path d="M9 11h6M9 15h6M9 7h3"/></svg>Plan</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="grab"></div>
  <div class="sheethead">
    <h3 id="sheet-title"></h3>
    <button class="x" id="sheet-x" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div id="sheet-body"></div>
</div>

<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gallery" accept="image/*" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script src="label.js"></script>
<script src="app.js"></script>
</body>
</html>
